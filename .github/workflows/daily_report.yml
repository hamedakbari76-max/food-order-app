name: Daily Food Order Report

on:
  schedule:
    # هر روز ساعت ۰۸:۰۰ UTC = ۱۱:۳۰ به وقت تهران
    - cron: '0 8 * * *'
  workflow_dispatch:   # امکان اجرای دستی

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas gspread google-auth

      - name: Run daily report
        env:
          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SHEET_NAME: foodorder
        run: python send_daily_report.py
